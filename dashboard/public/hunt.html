<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunt · Resume Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23fff' stroke='%231F5FAD' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%231F5FAD' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%231F5FAD'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/hunt.css">
</head>
<body>
  <div class="shell">
    <aside class="nav" id="nav">
      <header class="nav-head">
        <h1>Job Hunt</h1>
        <a class="link" href="/">Resumes →</a>
      </header>
      <nav class="nav-list" aria-label="Sections">
        <button type="button" data-view="sprint">Sprint</button>
        <button type="button" data-view="ask">Ask anything</button>
        <button type="button" data-view="profile">My profile</button>
        <button type="button" data-view="offers">Offers</button>
        <button type="button" data-view="settings">Settings · AI limits</button>
      </nav>
      <div class="nav-sub">
        <div class="nav-sub-head"><span class="label">Targets</span><button type="button" class="btn small primary" id="newTarget">+ New</button></div>
        <div id="targetList" class="target-list"></div>
      </div>
      <footer class="quota" id="quota" title="Open Settings for details"></footer>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/hunt.js"></script>
</body>
</html>
